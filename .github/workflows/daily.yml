name: daily-radar

# 每天北京时间 18:00 跑一次（GitHub Actions 用 UTC，10:00 UTC = 18:00 CST）
# 注意：GitHub 的定时任务高峰期可能延迟 5~30 分钟，属于平台行为
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只抓取不发邮件、不写状态"
        type: boolean
        default: false
      only:
        description: "只跑指定 source id（逗号分隔，留空=全部）"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 运行雷达
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
          LLM_MAX_CALLS: "70"
          SMTP_HOST: smtp.qq.com
          SMTP_PORT: "465"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.QQ_SMTP_AUTH_CODE }}
          MAIL_FROM: ${{ secrets.SMTP_USER }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m src.main --dry-run --only "${{ inputs.only }}"
          else
            python -m src.main --only "${{ inputs.only }}"
          fi

      - name: 提交状态与归档
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ docs/
          if git diff --staged --quiet; then
            echo "无变化"
          else
            git commit -m "chore: 更新活动状态 $(date -u +%Y-%m-%d)"
            git push
          fi
